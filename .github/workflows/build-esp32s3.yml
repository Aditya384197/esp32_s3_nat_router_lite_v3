name: Build ESP32-S3 NAT Router

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ESP32-S3 / ESP-IDF v5.5.4
    runs-on: ubuntu-latest

    # ESP-IDF पहले से installed है इस official Docker image में
    container:
      image: espressif/idf:v5.5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail

          echo "ESP-IDF version:"
          idf.py --version

          idf.py set-target esp32s3
          idf.py build

      - name: Validate and package flash artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_firmware.py

      - name: Create official merged flash image
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          idf.py merge-bin \
            -o artifacts/esp32s3_merged.bin

          test -s artifacts/esp32s3_merged.bin

          echo "Merged image:"
          ls -lh artifacts/esp32s3_merged.bin

      - name: Publish firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-nat-router
          path: artifacts/
          if-no-files-found: error
