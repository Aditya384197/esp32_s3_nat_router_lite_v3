name: Build ESP32-S3 NAT Router
on: push: branches: ["**"] pull_request: workflow_dispatch:
permissions: contents: read
jobs: build: name: ESP32-S3 / ESP-IDF v5.5.4 runs-on: ubuntu-latest
# Official ESP-IDF image.
# ESP-IDF and toolchain are already installed inside this image.
container:
  image: espressif/idf:v5.5.4

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Build and package firmware
    shell: bash
    run: |
      set -euo pipefail

      echo "========================================"
      echo "Loading pre-installed ESP-IDF environment"
      echo "========================================"

      source /opt/esp/idf/export.sh

      echo
      echo "ESP-IDF version:"
      idf.py --version

      echo
      echo "========================================"
      echo "Building ESP32-S3 firmware"
      echo "========================================"

      idf.py set-target esp32s3
      idf.py build

      echo
      echo "========================================"
      echo "Validating and packaging flash artifacts"
      echo "========================================"

      python3 tools/package_firmware.py

      echo
      echo "========================================"
      echo "Creating merged flash image"
      echo "========================================"

      mkdir -p artifacts

      idf.py merge-bin \
        -o artifacts/esp32s3_merged.bin

      test -s artifacts/esp32s3_merged.bin

      echo
      echo "========================================"
      echo "Final artifacts"
      echo "========================================"

      ls -lah artifacts/

  - name: Upload firmware artifacts
    uses: actions/upload-artifact@v4
    with:
      name: esp32s3-nat-router
      path: artifacts/
      if-no-files-found: error
