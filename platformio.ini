; The canonical build is the GitHub Actions workflow (.github/workflows/
; build-esp32s3.yml), which pins ESP-IDF v5.5.4 exactly via
; espressif/install-esp-idf-action. PlatformIO's espressif32 platform is
; provided for local iteration only; as of writing, the official
; platform-espressif32 registry does not ship an ESP-IDF 5.5.4 build, so
; this is pinned to the closest available (IDF v5.4 line) rather than a
; caret range - a caret range let the local toolchain silently drift to
; whatever 6.x happened to be latest, which could diverge from CI. If
; you need bit-for-bit parity with CI, build with `idf.py` directly
; using ESP-IDF v5.5.4 instead of PlatformIO.
[platformio]
src_dir = main

[env:esp32-s3-devkitc-1]
platform = espressif32@6.10.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.partitions = partitions_example.csv
monitor_filters = direct
monitor_speed = 115200
